    path: ./ruleset/gemini_domain.mrs

  openai_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geosite/openai.mrs"
