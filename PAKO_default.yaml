# ==========================================
# 分流规则
# ==========================================
rules:
  # 广告拦截
  - "RULE-SET,reject_domain,REJECT"

  # 本地局域网与 Steam CDN 直连
  - "DOMAIN-SUFFIX,steamserver.net,DIRECT"
  - "DOMAIN-SUFFIX,cm.steampowered.com,DIRECT"
  - "GEOSITE,private,DIRECT"

  # AI 领域
  - "RULE-SET,gemini_domain,智能AI"
  - "RULE-SET,openai_domain,智能AI"
  - "DOMAIN-SUFFIX,claude.ai,智能AI"
  - "DOMAIN-SUFFIX,anthropic.com,智能AI"
  - "DOMAIN-SUFFIX,copilot.microsoft.com,智能AI"

  # 流媒体与专有应用
  - "RULE-SET,youtube_domain,油管视频"
  - "RULE-SET,netflix_domain,奈飞电影"
  - "RULE-SET,spotify_domain,声田音乐"
  - "RULE-SET,tiktok_domain,外区抖音"
  - "RULE-SET,telegram_domain,电报聊天"
  - "RULE-SET,telegram_ip,电报聊天"
  - "RULE-SET,google_domain,谷歌搜索"
  - "RULE-SET,steam_domain,游戏软件"

  # 中国大陆直连
  - "RULE-SET,cn_domain,中国直连"
  - "RULE-SET,cn_ip,中国直连"
  - "GEOIP,CN,中国直连"

  # 最终兜底规则
  - "MATCH,手动选择"
