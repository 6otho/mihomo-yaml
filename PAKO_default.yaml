# ==========================================
# 🌟 PAKO 全规则分流完整版 (严格遵循 clash.md 官方规范)
# ==========================================
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

# 遵循 clash.md 规范：保存策略选择与 Fake-IP 缓存（小组件读取核心）
profile:
  store-selected: true
  store-fake-ip: true

mixed-port: 7890
allow-lan: false
bind-address: '*'
external-controller: 127.0.0.1:9090

# iOS/tvOS 官方推荐加载器
geodata-loader: memconservative

dns:
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  respect-rules: true
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
    - 114.114.114.114
  fallback:
    - 1.1.1.1
    - 8.8.8.8
  fallback-filter:
    geoip: true
    geoip-code: CN
    geosite:
      - gfw
    ipcidr:
      - 240.0.0.0/4
    domain:
      - "+.google.com"
      - "+.facebook.com"
      - "+.youtube.com"
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "connect.rom.miui.com"
    - "+.miwifi.com"
    - "+.ntp.org"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "time.windows.com"
    - "localhost.ptlogin2.qq.com"
    - "localhost.sec.qq.com"
    - "+.weixin.qq.com"
    - "+.wechat.com"
    - "+.steamcontent.com"
    - "+.steampowered.com"
    - "+.steamserver.net"

