  tiktok_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geosite/tiktok.mrs"
    path: ./ruleset/tiktok_domain.mrs

  steam_domain:
