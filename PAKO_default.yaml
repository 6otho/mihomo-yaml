# ==========================================
# 🚀 PAKO 极速自适应配置 (适配 Hako & 全平台 Mihomo)
# ==========================================
metadata:
  version: "2026.03"
  owner: "PAKO"
  note: "Hako / Mihomo Universal Optimized"

mixed-port: 7897
allow-lan: true
mode: rule
log-level: warning
ipv6: true
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
global-client-fingerprint: chrome
keep-alive-interval: 15

# 内存友好加载模式（防止 iOS NetworkExtension 内存闪退）
geodata-mode: false
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24

find-process-mode: off
sniffing: true

profile:
  store-selected: true
  store-fake-ip: false

dns:
  enable: true
  ipv6: false              # 建议关闭 DNS IPv6 查询，极大降低延迟与丢包
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  use-hosts: true
  cache-algorithm: lru
  
  # 引导 DNS (用于解析 DoH 自身域名，彻底杜绝冷启动死锁)
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29

  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query

  # 修复后的 Fake-IP 过滤名单 (严禁加 "*")
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - "connect.rom.miui.com"
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.steamcontent.com"
    - "+.steampowered.com"
    - "+.steamserver.net"
    - "localhost.ptlogin2.qq.com"
    - "+.weixin.qq.com"

# ==========================================
# 规则集 (全面改用 MRS 二进制高速规则，极省内存)
# ==========================================
rule-providers:
  reject_domain:
    type: http
    behavior: domain
    format: mrs
    interval: 86400
    url: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geo/geosite/category-ads-all.mrs"
    path: ./ruleset/reject_domain.mrs

  gemini_domain:
